name: release

# Push a version tag and this builds the standalone executable and publishes it:
#
#     git tag v1.0.3
#     git push origin v1.0.3
#
# "Run workflow" from the Actions tab also works — it builds and uploads the
# exe as a run artifact without publishing a release, which is handy for
# checking a build before tagging.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # required to create the release

jobs:
  build:
    name: Build NetPulse.exe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pywintrace

      # Never publish a build that does not pass its own tests.
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Refresh the application icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python main.py --write-ico

      - name: Build
        run: python -m PyInstaller --noconfirm --clean netpulse.spec

      - name: Check the executable is sane
        run: |
          if (-not (Test-Path dist\NetPulse.exe)) { throw "NetPulse.exe was not produced" }
          $size = (Get-Item dist\NetPulse.exe).Length
          Write-Host "Built dist\NetPulse.exe ($([math]::Round($size/1MB,1)) MB)"
          if ($size -lt 10MB) { throw "Executable is suspiciously small - the build is probably incomplete" }

      - name: Upload as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetPulse-exe
          path: dist/NetPulse.exe

      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $hash = (Get-FileHash dist\NetPulse.exe -Algorithm SHA256).Hash
          $size = [math]::Round((Get-Item dist\NetPulse.exe).Length / 1MB, 1)
          @"
          ## NetPulse ${{ github.ref_name }}

          A network usage monitor for Windows — upload and download per hour,
          day, week, month and year, broken down by application, with a log of
          the files that arrive on your machine.

          ### Download

          **[NetPulse.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/NetPulse.exe)** — $size MB, no Python required.

          Put it anywhere and run it. For the per-application breakdown,
          right-click it and choose **Run as administrator**; everything else
          works without.

          Windows SmartScreen will warn on first run because the file is not
          code-signed. **More info -> Run anyway**. Verify it first if you like:

          ``````
          SHA-256: $hash
          ``````

          ### Running from source instead

          Clone the repository and use ``install.bat`` — see the README.
          "@ | Out-File -FilePath notes.md -Encoding utf8

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists - replacing the executable"
            gh release upload $tag dist/NetPulse.exe --clobber
          } else {
            gh release create $tag dist/NetPulse.exe --title "NetPulse $tag" --notes-file notes.md
          }
