name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Qt needs a handful of system libraries even to render offscreen.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libfreetype6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyflakes

      # Optional, Windows only: enables the per-application breakdown at runtime.
      # Not required by the tests, so a failure here must not fail the build.
      - name: Install pywintrace (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: python -m pip install pywintrace

      - name: Lint
        run: python -m pyflakes netpulse main.py tools tests

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Smoke test against real traffic
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/smoketest.py

      - name: Render every page offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/screenshot.py screenshots

      - name: Upload rendered pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ matrix.os }}-py${{ matrix.python }}
          path: screenshots/
          if-no-files-found: ignore
